{% extends "base.html" %}

{% block content %}
<div class="page-container launch-page" style="background-image: url('{{ url_for('static', filename='images/bg_river.jpg') }}');">

    <div class="top-left-controls">
        <a href="{{ url_for('main.build') }}" class="back-button">
            <span class="icon">⬅️</span> กลับไปเลือกกระทง
        </a>
    </div>

    <div id="krathong-to-launch">
        {% if design == 'premade1' %}
            <img src="{{ url_for('static', filename='images/krathong_1.png') }}" alt="กระทง 1">
        {% elif design == 'premade2' %}
            <img src="{{ url_for('static', filename='images/krathong_2.png') }}" alt="กระทง 2">
        {% elif design == 'premade3' %}
            <img src="{{ url_for('static', filename='images/krathong_3.png') }}" alt="กระทง 3">
        {% elif design == 'premade4' %}
            <img src="{{ url_for('static', filename='images/krathong_4.png') }}" alt="กระทง 4">
        {% else %}
            <img src="{{ url_for('static', filename='images/krathong_1.png') }}" alt="กระทง">
        {% endif %}
    </div>

    <form method="POST" action="{{ url_for('main.launch') }}" id="launch-form">
        <div class="wish-box">
            <label for="wish">ได้เวลาอธิษฐานของคุณ:</label>
            <textarea name="wish" id="wish" placeholder="ขอให้เรารักกันนานๆ เหมือนกระทงที่ลอยไม่ดับ 🌕💖"></textarea>
            <button type="submit" class="btn-main" id="btn-launch">ลอยกระทง 🌕💖</button>
        </div>
    </form>

</div>
{% endblock %}
